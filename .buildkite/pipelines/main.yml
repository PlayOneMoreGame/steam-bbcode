steps:
  - label: ":terraform: Terraform CI"
    command: make tf-ci-apply
    agents:
      os: linux
      hardware_env: prod
    branches: main
    concurrency: 1
    concurrency_group: ci_steam-bbcode
  - wait
  - label: ":file_cabinet: Get Version"
    command:
      - .buildkite/tasks/version.sh
    agents:
      os: linux
      hardware_env: prod
  - wait
  - label: ":hammer: Build"
    command:
      - .buildkite/tasks/clean.sh && .buildkite/tasks/build.sh
    agents:
      os: linux
      hardware_env: prod
    artifact_paths:
      - "dist/**/*"
  - label: ":test_tube: Test"
    command:
      - .buildkite/tasks/clean.sh && .buildkite/tasks/test.sh
    agents:
      os: linux
      hardware_env: prod
  - wait
  - label: ":terraform: Deploy (live)"
    commands:
      - cd ops/live
      - make tf-live-upgrade
      - make tf-live-apply
    agents:
      os: linux
      hardware_env: prod
    branches: main
    concurrency: 1
    concurrency_group: deploy_steam-bbcode
  - wait
  - label: ":rocket: Publish"
    command:
      - .buildkite/tasks/publish.sh
    agents:
      os: linux
      hardware_env: prod
    branches: main
    concurrency: 1
    concurrency_group: publish_steam-bbcode
    retry:
      automatic:
        exit_status: "*"
        limit: 3
