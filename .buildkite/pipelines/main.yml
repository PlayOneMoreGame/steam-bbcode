steps:
  - label: ":hammer: build"
    command: .buildkite/build
    artifact_paths:
      - "pkg/steam_bbcode.tar.gz"
    agents:
      hardware_env: dev
      os: linux
  - wait
  - label: ":globe_with_meridians: deploy (staging)"
    command: .buildkite/deploy staging
    branches: main
    agents:
      hardware_env: dev
      os: linux
    env:
      AWS_S3_BUCKET: staging-steam-bbcode.dev.onemoregame.live
      AWS_CLOUDFRONT_DIST_ID: "ETNUMFXECZ49V"
      OMG_ENV: staging
